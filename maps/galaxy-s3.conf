# UI sound map: Galaxy S3 -> One UI
# models: GT-I9300 GT-I9305 SGH-I747 SGH-T999 SCH-I535 SPH-L710 SCH-R530 SC-06D SHV-E210
#
# Copied as ui-map.conf by the extractor (cgs-extract) when the firmware's
# model matches one of the models above.
#
# Built from GT-I9300 firmware I9300XXUGPE1 (Android 4.3) against a
# Galaxy S24 Ultra on One UI 9 (S928BXXU6EZIF, Android 17).
#
# 24 sounds share their name on both phones and are replaced automatically:
# Lock, Unlock, TW_Touch, S_HW_Touch, Keypress*, camera, LowBattery, etc.
# This file only covers the rest.
#
# Format: <One UI file name>=<Galaxy S3 file name>

# Charging: the S3 had a single sound for every kind of charger
ChargingStarted.ogg=Charger_Connection.ogg
ChargingStarted_Fast.ogg=Charger_Connection.ogg
WirelessChargingStarted.ogg=Charger_Connection.ogg

# One UI system sound themes (Settings > Sounds and vibration > System sound).
# Each theme has its own copy of these sounds; point them all to the S3 ones
# so the theme you pick doesn't bring the One UI sounds back.
TW_Touch_Calm.ogg=TW_Touch.ogg
TW_Touch_Fun.ogg=TW_Touch.ogg
TW_Touch_Retro.ogg=TW_Touch.ogg
S_HW_Touch_Calm.ogg=S_HW_Touch.ogg
S_HW_Touch_Fun.ogg=S_HW_Touch.ogg
S_HW_Touch_Retro.ogg=S_HW_Touch.ogg
TW_SIP_Calm.ogg=TW_SIP.ogg
TW_SIP_Fun.ogg=TW_SIP.ogg
TW_SIP_Retro.ogg=TW_SIP.ogg
S_SIP_Backspace_Calm.ogg=S_SIP_Backspace.ogg
S_SIP_Backspace_Fun.ogg=S_SIP_Backspace.ogg
S_SIP_Backspace_Retro.ogg=S_SIP_Backspace.ogg
TW_Silent_mode_off_Calm.ogg=TW_Silent_mode_off.ogg
TW_Silent_mode_off_Fun.ogg=TW_Silent_mode_off.ogg
TW_Silent_mode_off_Retro.ogg=TW_Silent_mode_off.ogg
TW_Volume_control_Calm.ogg=TW_Volume_control.ogg
TW_Volume_control_Fun.ogg=TW_Volume_control.ogg
TW_Volume_control_Retro.ogg=TW_Volume_control.ogg
LowBattery_Calm.ogg=LowBattery.ogg
LowBattery_Fun.ogg=LowBattery.ogg
LowBattery_Retro.ogg=LowBattery.ogg
ChargingStarted_Calm.ogg=Charger_Connection.ogg
ChargingStarted_Fun.ogg=Charger_Connection.ogg
ChargingStarted_Retro.ogg=Charger_Connection.ogg
ChargingStarted_Fast_Calm.ogg=Charger_Connection.ogg
ChargingStarted_Fast_Fun.ogg=Charger_Connection.ogg
ChargingStarted_Fast_Retro.ogg=Charger_Connection.ogg
