# Default sounds, written as ro.config.* properties.
# They only apply when no sound has been chosen yet (first boot or after
# resetting sound settings). Existing choices are never overridden: pick the
# new sounds in Settings > Sounds and vibration.
#
# Values are file names (no paths) from the matching source folder.
# Leave a value empty to keep the One UI default.
#
# You can put your own copy of this file in /sdcard/ClassicGalaxySounds/ and it
# will be used instead of this one.

DEFAULT_RINGTONE=
DEFAULT_RINGTONE_2=
DEFAULT_NOTIFICATION=
DEFAULT_ALARM=
