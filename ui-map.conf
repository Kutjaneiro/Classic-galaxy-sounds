# UI sound mapping: <One UI file name>=<old Galaxy file name>
#
# UI sounds (lock, unlock, touch, charging, ...) are loaded by fixed file
# names, so an old sound has to take the exact name of the One UI file it
# replaces.
#
# Files with the same name on both phones (case-insensitive) are matched
# automatically, so you only need lines here for the ones that were renamed.
#
# File names vary between firmware versions. Run tools/dump-device-sounds.sh
# with the phone connected to see which files match and which need a line.
#
# You can put your own copy of this file in /sdcard/ClassicGalaxySounds/ and it
# will be used instead of this one.
#
# Example (illustrative names, check yours):
# Touch_OneUI.ogg=Touch.ogg
